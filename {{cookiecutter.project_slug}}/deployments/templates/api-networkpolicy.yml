# API NetworkPolicy: Egress-only
# Used when project_type == 'api'
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{cookiecutter.project_slug}}-egress
  namespace: {{cookiecutter.project_slug}}-{{ "{{environment}}" }}
  labels:
    app: {{cookiecutter.project_slug}}
spec:
  podSelector:
    matchLabels:
      app: {{cookiecutter.project_slug}}
  policyTypes:
    - Egress
  egress:
    # DNS (kube-dns)
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS outbound
    - ports:
        - protocol: TCP
          port: 443
