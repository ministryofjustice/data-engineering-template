# Kubernetes Deployment for Dashboard/Frontend
# Single replica, minimal resources, simple health checks
#
# Customize:
# - image: Update to your ECR repository
# - resources: Dashboards are typically lightweight
# - env: Your dashboard configuration
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{cookiecutter.project_slug}}
  namespace: {{cookiecutter.project_slug}}-{{ "{{environment}}" }}
  labels:
    app: {{cookiecutter.project_slug}}
    type: dashboard
    version: {{ "{{image_tag}}" }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{cookiecutter.project_slug}}
  template:
    metadata:
      labels:
        app: {{cookiecutter.project_slug}}
        version: {{ "{{image_tag}}" }}
    spec:
      serviceAccountName: {{cookiecutter.project_slug}}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: {{ "{{ecr_registry}}" }}/{{cookiecutter.project_slug}}:{{ "{{image_tag}}" }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: dev  # {{environment}} - replace with actual environment
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
