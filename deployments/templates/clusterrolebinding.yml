# Optional: ClusterRoleBinding to grant permissions
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ${APP_NAME:-de-template}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ${APP_NAME:-de-template}
subjects:
  - kind: ServiceAccount
    name: ${APP_NAME:-de-template}
    namespace: ${KUBE_NAMESPACE}
