# Example Kubernetes ServiceAccount
# Required for your pods to authenticate to Kubernetes API
# and for RBAC permissions
#
# CUSTOMIZE: Add roles and rolebindings as needed
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${APP_NAME:-de-template}
  namespace: ${KUBE_NAMESPACE}
  labels:
    app: ${APP_NAME:-de-template}
    environment: ${ENV_SHORT:-dev}
