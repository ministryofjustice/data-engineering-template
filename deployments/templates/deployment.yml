# Example Kubernetes Deployment manifest
# This is a TEMPLATE - customize for your application
#
# To use:
#   1. Update the image URI, resource limits, environment variables
#   2. Adjust replicas, probes, security context for your needs
#   3. Ensure KUBE_NAMESPACE, APP_NAME, IMAGE_TAG are set as env vars in CI/CD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP_NAME:-de-template}
  namespace: ${KUBE_NAMESPACE}
  labels:
    app: ${APP_NAME:-de-template}
    version: ${IMAGE_TAG:-latest}
    environment: ${ENV_SHORT:-dev}
spec:
  replicas: ${REPLICAS:-2}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ${APP_NAME:-de-template}
  template:
    metadata:
      labels:
        app: ${APP_NAME:-de-template}
        version: ${IMAGE_TAG:-latest}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ${APP_NAME:-de-template}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: app
          # CUSTOMIZE: Update image URI for your ECR repository
          image: ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          # CUSTOMIZE: Adjust ports for your application
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # CUSTOMIZE: Set environment variables for your app
          env:
            - name: ENVIRONMENT
              value: ${ENV_SHORT:-dev}
            - name: APP_NAME
              value: ${APP_NAME:-de-template}
            - name: LOG_LEVEL
              value: "INFO"
            - name: DEBUG
              value: "false"
          # Reference ConfigMap or Secrets if needed
          # - name: DATABASE_URL
          #   valueFrom:
          #     secretKeyRef:
          #       name: app-secrets
          #       key: database-url
          # CUSTOMIZE: Adjust resource requests/limits
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # CUSTOMIZE: Health checks for your app
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          # CUSTOMIZE: Volume mounts if needed
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/cache
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      # CUSTOMIZE: Add init containers if needed (e.g., database migrations)
      initContainers: []
      # - name: migrate
      #   image: ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}
      #   command: ["python", "-m", "alembic", "upgrade", "head"]
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
      # CUSTOMIZE: Add node affinity, pod anti-affinity if needed
      affinity: {}
      # podAntiAffinity:
      #   preferredDuringSchedulingIgnoredDuringExecution:
      #     - weight: 100
      #       podAffinityTerm:
      #         labelSelector:
      #           matchExpressions:
      #             - key: app
      #               operator: In
      #               values:
      #                 - ${APP_NAME}
      #         topologyKey: kubernetes.io/hostname
      tolerations: []
      # Example: tolerate specific node taints
      # - key: workload-type
      #   operator: Equal
      #   value: data-engineering
      #   effect: NoSchedule

      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      restartPolicy: Always
