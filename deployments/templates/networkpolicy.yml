# Example Kubernetes NetworkPolicy
# This restricts traffic to/from your pods based on IP allowlist
#
# Use cases:
#   - Only allow traffic from specific IPs (Entra ID IP addresses, VPNs)
#   - Restrict inter-pod communication
#   - Deny all ingress by default
#
# CUSTOMIZE: Update allowed IPs, namespaces, and ports
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${APP_NAME:-de-template}-ingress
  namespace: ${KUBE_NAMESPACE}
  labels:
    app: ${APP_NAME:-de-template}
    environment: ${ENV_SHORT:-dev}
spec:
  podSelector:
    matchLabels:
      app: ${APP_NAME:-de-template}
  policyTypes:
    - Ingress
    - Egress
  # Allow ingress traffic
  ingress:
    # From ingress controller in the ingress-nginx namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    # CUSTOMIZE: Add IP-based allowlist
    # - from:
    #     - ipBlock:
    #         cidr: 0.0.0.0/0
    #         except:
    #           - 192.168.1.0/24  # Block this range
    #   ports:
    #     - protocol: TCP
    #       port: 8000
  # Allow egress traffic (DNS, HTTPS, etc.)
  egress:
    # DNS (required for service discovery)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # HTTPS to anywhere
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    # CUSTOMIZE: Add egress to databases, APIs, etc.
    # - to:
    #     - ipBlock:
    #         cidr: 10.0.0.0/8  # Private network
    #   ports:
    #     - protocol: TCP
    #       port: 5432  # PostgreSQL
    #     - protocol: TCP
    #       port: 3306  # MySQL
    # Allow traffic between pods in the same namespace
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
