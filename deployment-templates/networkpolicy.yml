---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-engineering-template-egress
  labels:
    app: ${NAMESPACE}
spec:
  podSelector:
    matchLabels:
      app: ${NAMESPACE}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
