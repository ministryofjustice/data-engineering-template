---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${NAMESPACE}-ingress
  annotations:
    external-dns.alpha.kubernetes.io/set-identifier: ${NAMESPACE}-ingress-${NAMESPACE}-green
    external-dns.alpha.kubernetes.io/aws-weight: "100"
    nginx.ingress.kubernetes.io/limit-rps: '10'
spec:
  ingressClassName: internal-non-prod
  rules:
    - host: ${APP_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${NAMESPACE}
                port:
                  number: 8080
