[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "de-template"
version = "0.1.0"
description = "A template repo for Data Engineering projects"
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"

dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest-mypy-plugins>=4.1.0",
    "ruff>=0.16.0",
    "bandit>=1.9.4",
    "detect-secrets>=1.5.0",
    "yamllint>=1.38.0",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0"
]

[tool.uv]
package = true
exclude-newer = "7 days"

[tool.setuptools.packages.find]
where = ["src", "."]

[project.scripts]
template = "template.main:main"

[tool.mypy]
strict = true
disallow_untyped_defs = true
exclude = ["migrations", "dist", "build", "typings", "tests"]
explicit_package_bases = true
warn_unused_ignores = true
show_error_codes = true
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
include_namespace_packages = true


[tool.ruff.lint]
extend-select = ["E", "B", "UP", "SIM", "I", "PT", "RUF"]
ignore = ["E501"]


[tool.lint.ruff.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
